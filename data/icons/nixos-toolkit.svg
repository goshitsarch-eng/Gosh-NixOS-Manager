<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- NixOS-inspired icon with toolkit theme -->
  <!-- Background circle -->
  <circle cx="24" cy="24" r="22" fill="#5277C3" stroke="#3465A4" stroke-width="2"/>

  <!-- NixOS lambda-like shape simplified -->
  <g fill="#FFFFFF">
    <!-- Main gear/cog shape representing toolkit -->
    <path d="M24 8 L26 14 L32 14 L28 18 L30 24 L24 20 L18 24 L20 18 L16 14 L22 14 Z"/>

    <!-- Wrench handle -->
    <rect x="22" y="22" width="4" height="14" rx="1"/>

    <!-- Wrench head -->
    <path d="M20 36 L28 36 L30 40 L18 40 Z"/>

    <!-- Small decorative elements -->
    <circle cx="12" cy="24" r="3" fill-opacity="0.6"/>
    <circle cx="36" cy="24" r="3" fill-opacity="0.6"/>
  </g>

  <!-- Subtle highlight -->
  <ellipse cx="24" cy="16" rx="10" ry="6" fill="#FFFFFF" fill-opacity="0.15"/>
</svg>
