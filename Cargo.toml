[workspace]
resolver = "2"
members = [
    "crates/gui",
    "crates/helper",
    "crates/common",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "GPL-3.0-or-later"
repository = "https://github.com/devjonesafrica/NixOSApp"
authors = ["NixOS Toolkit Contributors"]

[workspace.dependencies]
# GTK4 and libadwaita bindings (aliased as gtk and adw)
gtk = { package = "gtk4", version = "0.9" }
adw = { package = "libadwaita", version = "0.7" }
glib = "0.20"
gio = "0.20"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime (for helper)
tokio = { version = "1.0", features = ["full"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# File operations
tempfile = "3.0"

# Internal crates
common = { path = "crates/common" }

[profile.release]
lto = true
codegen-units = 1
strip = true
