[workspace]
resolver = "2"
members = [
    "crates/gui",
    "crates/helper",
    "crates/common",
    "crates/fake-helper",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
license = "GPL-3.0-or-later"
repository = "https://github.com/goshitsarch-eng/Gosh-NixOS-Manager"
authors = ["NixOS Toolkit Contributors"]

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime (for helper)
tokio = { version = "1.0", features = ["full"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# File operations
tempfile = "3.0"

# Internal crates
common = { path = "crates/common" }

[profile.release]
lto = true
codegen-units = 1
strip = true
