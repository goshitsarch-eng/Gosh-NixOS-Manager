[package]
name = "gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "NixOS Toolkit - libcosmic GUI application"

[lib]
name = "nixos_toolkit_gui"
path = "src/lib.rs"

[[bin]]
name = "nixos-toolkit"
path = "src/main.rs"

[dependencies]
libcosmic = { git = "https://github.com/pop-os/libcosmic.git", rev = "7cc116803b18d7b888eb511b009f775f036c3da7", default-features = false, features = ["winit", "wayland", "x11", "wgpu", "tokio", "xdg-portal", "about", "a11y"] }

i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10"
rust-embed = "8"

serde = { workspace = true }
serde_json = { workspace = true }

anyhow = { workspace = true }
thiserror = { workspace = true }

tracing = { workspace = true }
tracing-subscriber = { workspace = true }

common = { workspace = true }

dirs = "6"
open = "5.3"
# iced_winit at the libcosmic pin needs UnboundedReceiver::try_recv (futures-channel >= 0.3.32)
futures = "0.3.32"

[dev-dependencies]
serde_json = { workspace = true }
